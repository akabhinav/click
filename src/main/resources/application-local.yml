spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/clickaggregator
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

kafka:
  topics:
    click-events: click-events
  consumer:
    group-id: click-aggregator-consumer
    concurrency: 3

logging:
  level:
    root: INFO
    com.adtech.clickaggregator: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
